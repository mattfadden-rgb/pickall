<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b1220" />
<title>RIK’s Pick-All 2026</title>
<style>
  :root {
    --bg: #0b1220; --bg2: #121a2b; --card: #172033; --line: #2a3754;
    --text: #e8eefc; --muted: #93a0bb; --accent: #7dd3fc;
    --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { padding-bottom: 88px; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,18,32,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); padding: 12px 14px 8px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 72px; flex: 1; }
  .stat b { display: block; font-size: 16px; }
  .stat span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .weekbar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 6px; }
  .wk { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-weight: 700; font-size: 13px; }
  .wk.on { background: #1d4ed8; border-color: #60a5fa; }
  .wk.done { outline: 2px solid var(--good); }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: #0e1626; border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); padding: 8px 4px; font-size: 11px; font-weight: 600; }
  nav.tabs button.on { color: var(--accent); }
  main { padding: 8px 14px 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .game { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
  .side { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 8px; text-align: center; min-height: 88px; }
  .side.pick { border-color: var(--good); box-shadow: 0 0 0 1px var(--good) inset; background: #10291f; }
  .side.used, .side.bye { opacity: .4; }
  .abbr { font-weight: 800; font-size: 18px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .mid { text-align: center; font-size: 11px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  input, select { background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 14px; width: 100%; }
  input.spread { width: 84px; text-align: center; }
  button.btn { background: #1d4ed8; color: white; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 13px; }
  button.btn.ghost { background: var(--bg2); color: var(--text); border: 1px solid var(--line); }
  button.btn.good { background: #047857; }
  button.btn.warn { background: #92400e; }
  .grid32 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tm { border: 1px solid var(--line); background: var(--bg2); border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 12px; }
  .tm b { display: block; font-size: 14px; }
  .tm.gone { opacity: .4; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 999px; background: #1e293b; color: var(--muted); }
  .badge.good { background: #064e3b; color: #6ee7b7; }
  .badge.bad { background: #4c0519; color: #fda4af; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .chip { display:inline-block; font-size:10px; padding:2px 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .ok { color: var(--good); } .no { color: var(--bad); } .warnc { color: var(--warn); }
  h2 { font-size: 15px; margin: 14px 0 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #065f46; color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 50; display: none; }
</style>
</head>

const COMMISH = "goforgin123@gmail.com";

const NAME_ABBR = {
  "Arizona Cardinals":"ARI","Atlanta Falcons":"ATL","Baltimore Ravens":"BAL","Buffalo Bills":"BUF",
  "Carolina Panthers":"CAR","Chicago Bears":"CHI","Cincinnati Bengals":"CIN","Cleveland Browns":"CLE",
  "Dallas Cowboys":"DAL","Denver Broncos":"DEN","Detroit Lions":"DET","Green Bay Packers":"GB",

const state = load();
let tab = "week";
let week = state.week || 1;
let pulling = false;

function load(){
  try {
    const s = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY) || "null") || {});
    s.lines = s.lines || {};
    s.lineMeta = s.lineMeta || {};
    s.picks = s.picks || {};
    s.results = s.results || {};
    s.playerName = s.playerName || "";
    return s;
  } catch(e){ return defaultState(); }
}
function defaultState(){
  return { week:1, picks:{}, results:{}, lines:{}, lineMeta:{}, playerName:"" };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function usedMap(){
  const m = {};
  for (const [w, arr] of Object.entries(state.picks)) {
    (arr||[]).forEach(t => { if(t) m[t] = Number(w); });
  }
  return m;
}
function remaining(){
  const used = usedMap();
  return Object.keys(TEAMS).filter(t => !used[t]);
}
function record(){
  let w=0,l=0,margin=0,graded=0,pending=0;
  const byWeek = {};
  for (let wk=1;wk<=17;wk++){
    const arr = state.picks[wk]||[];
    const slot = {w:0,l:0,margin:0,pending:0};
    arr.forEach(t=>{
      const r = ((state.results[wk]||{})[t])||{};
      if (!r.wl){ pending++; slot.pending++; return; }
      graded++;
      if (r.wl==="W"){ w++; slot.w++; } else { l++; slot.l++; }
      const m = Number(r.margin)||0;
      margin += m; slot.margin += m;
    });
    byWeek[wk]=slot;
  }
  return {w,l,margin,graded,pending,left:remaining().length,byWeek};
}
function findGame(wk, team){
  return (WEEKS[wk].games||[]).find(g => g.home===team || g.away===team);
}
function signedMargin(wl, raw){
  if (raw==="" || raw==null) return "";
  const n = Math.abs(Number(raw));
  if (Number.isNaN(n)) return raw;
  if (wl==="L") return -n;
  if (wl==="W") return n;
  return raw;
}
function normAbbr(a){
  if (!a) return a;
  const u = String(a).toUpperCase();
  return ESPN_ABBR[u] || u;
}
function gameLine(wk, g){
  const key = wk+":"+g.away+"@"+g.home;
  if (state.lines[key] != null && state.lines[key] !== "") return Number(state.lines[key]);
  if (g.homeSpread != null) return Number(g.homeSpread);
  return null;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  setTimeout(()=>{ el.style.display="none"; }, 2200);
}

async function pullEspnLines(wk, {silent}={}){
  pulling = true;
  if (!silent) toast("Pulling lines…");
  try {
    const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week="+wk;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    let n = 0;
    (data.events||[]).forEach(ev => {
      const c = (ev.competitions||[])[0];
      if (!c) return;
      const home = normAbbr((c.competitors.find(t=>t.homeAway==="home")||{}).team?.abbreviation);
      const away = normAbbr((c.competitors.find(t=>t.homeAway==="away")||{}).team?.abbreviation);
      const o = (c.odds||[])[0];
      if (!home || !away || !o) return;
      let hs = null;
      const raw = o.pointSpread?.home?.close?.line;
      if (raw != null && raw !== "") hs = Number(String(raw).replace("+",""));
      else if (typeof o.spread === "number") hs = o.homeTeamOdds?.favorite ? Number(o.spread) : Number(o.spread);
      if (hs == null && o.details) {
        const m = String(o.details).match(/([A-Z]{2,3})\s*([+-]?\d+\.?\d*)/);
        if (m) {
          const fav = normAbbr(m[1]);
          const mag = Number(m[2]);
          hs = fav === home ? mag : -mag;
        }
      }
      if (hs == null || Number.isNaN(hs)) return;
      const key = wk+":"+away+"@"+home;
      state.lines[key] = hs;
      state.lineMeta[key] = { details: o.details || "", src: (o.provider&&o.provider.name)||"ESPN", pulled: new Date().toISOString() };
      n++;
    });
    save();
    toast(n ? ("Loaded "+n+" lines") : "No lines posted for this week yet");
    return n;
  } catch (err) {
    toast("Could not reach ESPN. Open in Safari.");
    return 0;
  } finally { pulling = false; }
}

async function pullEspnResults(wk){
  try {
    const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week="+wk;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const picks = state.picks[wk]||[];
    if (!picks.length) return 0;
    let n=0;
    (data.events||[]).forEach(ev => {
      const c = (ev.competitions||[])[0];
      if (!c) return;
      const done = c.status?.type?.completed;
      const home = normAbbr((c.competitors.find(t=>t.homeAway==="home")||{}).team?.abbreviation);
      const away = normAbbr((c.competitors.find(t=>t.homeAway==="away")||{}).team?.abbreviation);
      const hs = Number((c.competitors.find(t=>t.homeAway==="home")||{}).score);
      const as = Number((c.competitors.find(t=>t.homeAway==="away")||{}).score);
      picks.forEach(team => {
        if (team!==home && team!==away) return;
        if (!done) return;
        const my = team===home ? hs : as;
        const opp = team===home ? as : hs;
        const tie = my===opp;
        const wl = (!tie && my>opp) ? "W" : "L";
        const margin = my - opp;
        state.results[wk] = state.results[wk] || {};
        state.results[wk][team] = {wl, margin, score: my+"–"+opp};
        n++;
      });
    });
    save();
    return n;
  } catch(e){ return 0; }
}

function renderHeader(){
  const rec = record();
  document.getElementById("sWins").textContent = rec.w+"–"+rec.l;
  document.getElementById("sLeft").textContent = rec.left;
  document.getElementById("sMargin").textContent = (rec.margin>0?"+":"")+rec.margin;
  document.getElementById("sNeed").textContent = rec.graded+"/32";
  let bar = "";
  for (let w=1;w<=17;w++){
    const on = w===week ? " on" : "";
    const done = (state.picks[w]||[]).length >= (WEEKS[w].need||0) ? " done" : "";
    bar += `<button class="wk${on}${done}" data-wk="${w}">${w}</button>`;
  }
  document.getElementById("weekbar").innerHTML = bar;
  document.querySelectorAll("#weekbar .wk").forEach(b=>{
    b.onclick = () => { week = Number(b.dataset.wk); state.week = week; save(); render(); };
  });
}

function renderWeek(){
  const info = WEEKS[week];
  const used = usedMap();
  const picks = state.picks[week] || [];
  let html = `<div class="card"><div class="row"><div>
      <b>Week ${week}</b> <span class="badge">${info.label||""}</span>
      <div class="note">${info.need} pick${info.need>1?"s":""} · Sunday deadline 11:30a ET unless noted</div>
      ${info.early?`<div class="note warnc">${info.early}</div>`:""}
      ${info.byes?`<div class="note">Byes: ${info.byes.join(", ")}</div>`:""}
    </div></div>
    <div class="actions">
      <button class="btn good" id="pullLines">Refresh lines</button>
      <button class="btn good" id="emailPicks">Email picks</button>
      <button class="btn ghost" id="copyMail">Copy email</button>
      <button class="btn ghost" id="clearWk">Clear week</button>
    </div>
    <div class="note">${picks.length}/${info.need} selected. Tap a team to add or remove.</div>
  </div>
  <div class="card">
    <b>Email preview</b>
    <div class="note">To ${COMMISH}</div>
    <div class="row" style="margin:6px 0"><input id="playerName" placeholder="Your name" value="${(state.playerName||"").replace(/"/g,"&quot;")}" /></div>
    <div class="note"><b>Subject:</b> ${emailSubject()}</div>
    <pre style="white-space:pre-wrap;font-size:12px;line-height:1.45;margin:8px 0 0;color:var(--text)">${weekEmailBody().replace(/</g,"&lt;")}</pre>
  </div>`;

  (info.games||[]).forEach(g=>{
    const hs = gameLine(week,g);
    const lineTxt = hs==null ? "" : (hs>0?("+"+hs):String(hs));
    const byeHome = (info.byes||[]).includes(g.home);
    const byeAway = (info.byes||[]).includes(g.away);
    const usedHome = used[g.home] && used[g.home]!==week;
    const usedAway = used[g.away] && used[g.away]!==week;
    html += `<div class="card"><div class="game">
      <button class="side ${picks.includes(g.away)?"pick":""} ${usedAway?"used":""} ${byeAway?"bye":""}" data-pick="${g.away}">
        <div class="abbr">${g.away}</div>
        <div class="meta">${TEAMS[g.away]?TEAMS[g.away].name:""}</div>
        <div class="meta">${usedAway?("used W"+used[g.away]): byeAway?"BYE":"away"}</div>
      </button>
      <div class="mid">${g.when||""}<br>${lineTxt?("home "+lineTxt):"vs"}<br><span class="note">${g.note||""}</span></div>
      <button class="side ${picks.includes(g.home)?"pick":""} ${usedHome?"used":""} ${byeHome?"bye":""}" data-pick="${g.home}">
        <div class="abbr">${g.home}</div>
        <div class="meta">${TEAMS[g.home]?TEAMS[g.home].name:""}</div>
        <div class="meta">${usedHome?("used W"+used[g.home]): byeHome?"BYE":"home"}</div>
      </button>
    </div></div>`;
  });

  document.getElementById("app").innerHTML = html;
  document.querySelectorAll("[data-pick]").forEach(btn=>{
    btn.onclick = () => togglePick(btn.dataset.pick);
  });
  document.getElementById("pullLines").onclick = async () => { await pullEspnLines(week); render(); };
  document.getElementById("clearWk").onclick = () => { state.picks[week]=[]; save(); render(); };
  document.getElementById("emailPicks").onclick = emailPicks;
  const nameInp = document.getElementById("playerName");
  if (nameInp) nameInp.onchange = nameInp.onblur = () => { state.playerName = nameInp.value.trim(); save(); render(); };
  document.getElementById("copyMail").onclick = copyEmail;
}

function togglePick(team){
  const used = usedMap();
  if (used[team] && used[team]!==week) { toast(team+" already used in Week "+used[team]); return; }
  const info = WEEKS[week];
  if ((info.byes||[]).includes(team)) { toast(team+" is on bye"); return; }
  let arr = (state.picks[week]||[]).slice();
  if (arr.includes(team)) arr = arr.filter(t=>t!==team);
  else {
    if (arr.length>=info.need) { toast("Week "+week+" already has "+info.need+" pick(s)"); return; }
    const g = info.games.find(x=>x.home===team||x.away===team);
    if (g && (arr.includes(g.home)||arr.includes(g.away))) { toast("Can't pick both sides"); return; }
    arr.push(team);
  }
  state.picks[week]=arr; save(); render();
}


function pickLabel(t){
  const n = TEAMS[t] && TEAMS[t].name;
  return n ? (t + " " + n) : t;
}
function emailSubject(){
  const picks = state.picks[week]||[];
  const who = (state.playerName||"").trim();
  const names = picks.map(pickLabel).join(", ") || "(none)";
  const head = who ? who+" — " : "";
  return head+"Pick-All 2026 — Week "+week+": "+names;
}
function weekEmailBody(){
  const picks = state.picks[week]||[];
  const rec = record();
  return `Week ${week} picks: ${(picks.join(" and ")||"(none yet)")}

Card so far: ${rec.w}-${rec.l}, net margin ${rec.margin>0?"+":""}${rec.margin}
Still unused: ${remaining().join(", ")||"none"}`;
}
function openMail(subject, body){
  window.location.href = "mailto:"+COMMISH+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
}
function emailPicks(){
  const picks = state.picks[week]||[];
  if (!picks.length) { toast("Pick a team first"); return; }
  openMail(emailSubject(), weekEmailBody());
}
function copyEmail(){
  const picks = state.picks[week]||[];
  if (!picks.length) { toast("Pick a team first"); return; }
  const text = emailSubject()+"\n\n"+weekEmailBody();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>toast("Email copied")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Email copied"); } catch(e){ toast("Copy failed"); }
  document.body.removeChild(ta);
}

function renderRoster(){
  const used = usedMap();
  const left = remaining();
  let html = `<div class="card"><b>Inventory</b>
    <div class="note">${left.length} unused · tap nothing here — pick on This Week</div></div>
    <div class="grid32">`;
  Object.keys(TEAMS).sort().forEach(t=>{
    const u = used[t];
    const r = u ? ((state.results[u]||{})[t]||{}) : {};
    html += `<div class="tm ${u?"gone":""}"><b>${t}</b>${u?`W${u} ${r.wl||""}`:`bye ${TEAMS[t].bye}`}</div>`;
  });
  html += `</div><h2>Still available</h2><div class="card note">${left.join(" · ")||"None"}</div>`;
  document.getElementById("app").innerHTML = html;
}

function renderCard(){
  let html = `<div class="card"><b>Your card</b>

    <div class="card" style="overflow-x:auto"><table>
      <tr><th>Wk</th><th>Picks</th><th>Need</th></tr>`;

    const arr = state.picks[w]||[];
    html += `<tr><td><b>${w}</b></td><td>${arr.length?`<span class="ok">${arr.join(" + ")}</span>`:"—"}</td><td>${arr.length}/${WEEKS[w].need}</td></tr>`;
  }
  html += `</table></div>`;
  document.getElementById("app").innerHTML = html;
}

function renderResults(){
  const rec = record();
  let html = `<div class="card">
      <b>Pool score</b>
      <div style="font-size:28px;margin:6px 0">${rec.w}–${rec.l}</div>
      <div>Tiebreaker net margin <b>${rec.margin>0?"+":""}${rec.margin}</b></div>
      <div class="note">${rec.graded} graded · ${rec.pending} pending · ${rec.left} unused</div>
    </div>
    <div class="actions"><button class="btn good" id="gradeEspn">Grade finished games</button></div>`;

  let any=false;
  for (let w=1;w<=17;w++){
    const arr = state.picks[w]||[];
    if (!arr.length) continue;
    any=true;
    const wk = rec.byWeek[w];
    html += `<div class="card"><div class="row"><b>Week ${w}</b><span class="badge">${wk.w}–${wk.l}${wk.pending?" · "+wk.pending+" open":""} · ${wk.margin>0?"+":""}${wk.margin}</span></div>`;
    arr.forEach(t=>{
      const r = ((state.results[w]||{})[t])||{wl:"",margin:""};
      const g = findGame(w,t);
      const opp = g ? (g.home===t?g.away:g.home) : "";
      const loc = g ? (g.home===t?"vs":"@") : "";
      html += `<div style="margin-top:10px">
        <div class="row">
          <div><b>${t}</b> <span class="note">${loc} ${opp}${r.score?" · "+r.score:""}</span></div>
          <span class="badge ${r.wl==="W"?"good":r.wl==="L"?"bad":""}">${r.wl==="W"?"WIN":r.wl==="L"?"LOSS":"OPEN"}</span>
        </div>
        <div class="row" style="margin-top:6px">
          <select data-wl="${w}:${t}">
            <option value="" ${!r.wl?"selected":""}>Pending</option>
            <option value="W" ${r.wl==="W"?"selected":""}>Win</option>
            <option value="L" ${r.wl==="L"?"selected":""}>Loss / tie</option>
          </select>
          <input class="spread" data-mg="${w}:${t}" value="${r.margin==null||r.margin===""?"":r.margin}" placeholder="margin" />
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  if (!any) html += `<div class="card note">No picks yet. Lock a week on This Week first.</div>`;
  html += `<div class="actions"><button class="btn warn" id="resetAll">Reset all data</button></div>`;
  document.getElementById("app").innerHTML = html;

  document.getElementById("gradeEspn").onclick = async () => {
    toast("Checking ESPN finals…");
    let total=0;
    const weeks = Object.keys(state.picks).map(Number).filter(w=> (state.picks[w]||[]).length);
    for (const w of weeks) total += await pullEspnResults(w);
    toast(total? ("Graded "+total+" pick(s)") : "No finished games on your card yet");
    render();
  };
  document.querySelectorAll("[data-wl]").forEach(sel=>{
    sel.onchange = () => {
      const [w,t] = sel.dataset.wl.split(":");
      state.results[w]=state.results[w]||{};
      const prev = state.results[w][t]||{};
      const wl = sel.value;
      state.results[w][t]=Object.assign({}, prev, {wl, margin: signedMargin(wl, prev.margin)});
      save(); render();
    };
  });
  document.querySelectorAll("[data-mg]").forEach(inp=>{
    inp.onchange = () => {
      const [w,t] = inp.dataset.mg.split(":");
      state.results[w]=state.results[w]||{};
      const prev = state.results[w][t]||{};
      const wl = prev.wl||"";
      state.results[w][t]=Object.assign({}, prev, {margin: wl? signedMargin(wl, inp.value): inp.value});
      save(); render();
    };
  });
  document.getElementById("resetAll").onclick = () => {
    if (!confirm("Erase picks and results?")) return;
    localStorage.removeItem(KEY);
    location.reload();
  };
}
